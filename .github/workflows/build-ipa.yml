name: Build Tahu Bulat iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # Ensure compatible objectVersion for Xcode
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 60/' TahuBulat.xcodeproj/project.pbxproj

      - name: Build iOS Application (.app)
        run: |
          xcodebuild -project TahuBulat.xcodeproj \
            -scheme TahuBulat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr TahuBulat.ipa Payload
          echo "IPA Size:"
          ls -lh TahuBulat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TahuBulat-iOS-IPA
          path: TahuBulat.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.1
          name: "Tahu Bulat Native iOS v1.3.1 (Fixed Shop Upgrade Text & Category Tabs)"
          body: |
            ## Tahu Bulat Native iOS (SwiftUI) v1.3.1
            
            Surgical fix untuk Pasar Upgrade & UI Rendering:
            - **Fixed Hex Color Alpha Parser Bug**: Memperbaiki fungsi `Color(hex:)` di mana string beralamat prefix `0x` salah di-parse sebagai ARGB 32-bit dengan alpha 0.0 (menyebabkan teks judul, deskripsi, harga, dan tombol menjadi 100% transparan/tidak terlihat).
            - **Fixed Category Tabs Wrapping**: Tab kategori ("Dapur", "Bumbu", "Promosi", "Cabang") kini dibungkus `ScrollView` horizontal dengan `lineLimit(1)` dan `fixedSize()` sehingga teks tidak terhimpit atau pecah vertikal ("Da pu r").
            - **Dark Mode Shop Cards**: Mengubah kartu upgrade dari hardcoded putih menjadi kontras gelap (`0x21262D`) selaras dengan tema game dan Dark Mode iOS.
            - Format file: `.ipa` (Install via TrollStore, AltStore, Sideloadly, Scarlet).
          files: TahuBulat.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
