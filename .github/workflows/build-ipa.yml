name: Build Tahu Bulat iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # Ensure compatible objectVersion for Xcode
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 60/' TahuBulat.xcodeproj/project.pbxproj

      - name: Build iOS Application (.app)
        run: |
          xcodebuild -project TahuBulat.xcodeproj \
            -scheme TahuBulat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr TahuBulat.ipa Payload
          echo "IPA Size:"
          ls -lh TahuBulat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TahuBulat-iOS-IPA
          path: TahuBulat.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "Tahu Bulat Native iOS v1.3.0 (Fixed Floating Truck, Wheels & Cohesive Scene)"
          body: |
            ## Tahu Bulat Native iOS (SwiftUI) v1.3.0
            
            Pembaruan visual menyeluruh dan perbaikan layout:
            - **Fixed Floating Truck**: Mobil pikap kini memiliki roda terpasang sempurna di kedua spakbor fender (x=95 & x=360, cy=185) menapak kokoh di aspal dengan bayangan sasis.
            - **Cohesive Truck Rig**: Tenda, plang kayu Tahu Bulat, speaker TOA, dan Akang di bak belakang telah dirakit menyatu sesuai scene graph XML resmi Own Games (`df4_c.ogt`).
            - **Cooking Animation**: Akang kini condong ke depan dan sutil masuk pas ke wajan saat pemain tap untuk menggoreng tahu.
            - **Smooth Customer Queue**: Pembeli berjalan lancar di trotoar depan mobil pikap.
            - **Bounded Wajan & Ambient Night**: Memperbaiki void hitam dan membatasi koordinat buih minyak agar tidak mengganggu layout.
            - **100% Native SwiftUI**: Target iOS 16.0+, support 120Hz ProMotion.
            - Format file: `.ipa` (Install via TrollStore, AltStore, Sideloadly, Scarlet).
          files: TahuBulat.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
